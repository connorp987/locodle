version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: locodle-postgres
    environment:
      POSTGRES_USER: locodle
      POSTGRES_PASSWORD: locodle_dev_password
      POSTGRES_DB: locodle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locodle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
