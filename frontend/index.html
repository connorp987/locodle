<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Locodle" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Locodle - Daily Location Guessing Game</title>
    <meta name="description" content="Find the famous place hidden on the world map, with hot-and-cold distance clues after every guess. A new geography challenge every day." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://locodle.com/" />
    <meta property="og:title" content="Locodle - Daily Location Guessing Game" />
    <meta property="og:description" content="Find the famous place hidden on the world map, with hot-and-cold distance clues after every guess. A new geography challenge every day." />
    <meta property="og:image" content="https://locodle.com/preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://locodle.com/" />
    <meta property="twitter:title" content="Locodle - Daily Location Guessing Game" />
    <meta property="twitter:description" content="Find the famous place hidden on the world map, with hot-and-cold distance clues after every guess. A new geography challenge every day." />
    <meta property="twitter:image" content="https://locodle.com/preview.png" />
    
    <meta name="theme-color" content="#ffffff" />

    <!-- Web only (Discord proxies API/tiles and blocks GA) -->
    <script>
      if (!window.location.hostname.includes("discordsays.com")) {
        // Warm up connections and fetch the initial map tiles (zoom 2, center)
        // before the JS bundle runs; these tiles are the LCP element.
        const addLink = (attrs) => {
          const link = document.createElement('link');
          Object.assign(link, attrs);
          document.head.appendChild(link);
        };
        addLink({ rel: 'preconnect', href: 'https://api.locodle.com', crossOrigin: 'anonymous' });
        addLink({ rel: 'preconnect', href: 'https://server.arcgisonline.com' });
        ['1/1', '1/2', '2/1', '2/2'].forEach((yx) => {
          addLink({
            rel: 'preload',
            as: 'image',
            fetchPriority: 'high',
            href: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/2/' + yx,
          });
        });

        // Google Analytics: load after page load so it doesn't compete with
        // the app bundle and map tiles. gtag() calls queue in dataLayer until then.
        window.addEventListener('load', () => {
          const script = document.createElement('script');
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-8V7LKZ4W98";
          document.head.appendChild(script);
        });

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-8V7LKZ4W98');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
