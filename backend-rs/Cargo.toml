[package]
name = "locodle-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "compression-gzip", "compression-zstd", "compression-br", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
